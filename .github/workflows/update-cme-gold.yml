name: Update CME Gold Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 1-5"

permissions:
  contents: write

jobs:
  fetch-cme-gc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and parse CME PG62
        run: python scripts/fetch_pg62_gc.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cme-gc-latest.json
          git diff --cached --quiet || git commit -m "Update CME GC data"
          git push
