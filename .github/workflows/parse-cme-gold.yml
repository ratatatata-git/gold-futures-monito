name: Parse CME Gold PDF

on:
  workflow_dispatch:
  push:
    paths:
      - "data/cme-pg62/*.pdf"
      - "data/cme-pg64/*.pdf"
      - "scripts/parse_pg62_gc.py"
      - "scripts/parse_pg64.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  parse-cme-gold:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Parse PG62 PDFs
        run: python scripts/parse_pg62_gc.py

      - name: Parse PG64 PDFs
        run: python scripts/parse_pg64.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/cme-gc-history.json \
            data/cme-gold-options-history.json

          git diff --cached --quiet || git commit -m "Update CME Gold futures and options history"
          git push
