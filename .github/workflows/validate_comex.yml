name: Validate COMEX PDFs

on:
  push:
    paths:
      - "data/cme-pg62/**"
      - "data/cme-pg64/**"
      - "scripts/**"
      - "tests/test_comex_v5.py"
      - "tests/test_pg62_master.py"
      - ".github/workflows/validate_comex.yml"

  pull_request:
    paths:
      - "data/cme-pg62/**"
      - "data/cme-pg64/**"
      - "scripts/**"
      - "tests/test_comex_v5.py"
      - "tests/test_pg62_master.py"
      - ".github/workflows/validate_comex.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-comex:
    name: Validate COMEX PG62 / PG64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f pg64-requirements.txt ]; then
            pip install -r pg64-requirements.txt
          fi

          pip install pytest pdfplumber

      - name: Show repository structure
        run: |
          echo "=== Repository ==="
          pwd

          echo ""
          echo "=== PG62 PDFs ==="
          find data/cme-pg62 \
            -maxdepth 1 \
            -type f \
            -name "*.pdf" \
            -print 2>/dev/null || true

          echo ""
          echo "=== PG64 PDFs ==="
          find data/cme-pg64 \
            -maxdepth 1 \
            -type f \
            -name "*.pdf" \
            -print 2>/dev/null || true

          echo ""
          echo "=== PG62 parser / MASTER builder ==="
          ls -l \
            scripts/parse_pg62_v5.py \
            scripts/build_pg62_master.py

          echo ""
          echo "=== PG64 parser ==="
          ls -l \
            scripts/parse_pg64_v5.py

          echo ""
          echo "=== Tests ==="
          ls -l \
            tests/test_comex_v5.py \
            tests/test_pg62_master.py

      - name: Check required files
        run: |
          set -e

          test -f scripts/parse_pg62_v5.py
          test -f scripts/parse_pg64_v5.py
          test -f scripts/build_pg62_master.py

          test -f tests/test_comex_v5.py
          test -f tests/test_pg62_master.py

          test -f data/cme-pg62/PG62_2026-09-23.pdf
          test -f data/cme-pg62/PG62_2026-09-25.pdf
          test -f data/cme-pg64/PG64_2026-09-25.pdf

          echo "All required files exist."

      - name: Compile Python files
        run: |
          python -m py_compile \
            scripts/parse_pg62_v5.py \
            scripts/parse_pg64_v5.py \
            scripts/build_pg62_master.py \
            tests/test_comex_v5.py \
            tests/test_pg62_master.py

          echo "Python compilation passed."

      - name: Run COMEX v5 integration tests
        run: |
          pytest -q tests/test_comex_v5.py

      - name: Run PG62 MASTER tests
        run: |
          pytest -q tests/test_pg62_master.py

      - name: Validation summary
        if: success()
        run: |
          echo "========================================"
          echo "COMEX VALIDATION PASSED"
          echo "========================================"

          echo ""
          echo "PG62:"
          echo "  2026-09-23 FINAL"
          echo "  2026-09-25 PRELIMINARY"

          echo ""
          echo "PG62 MASTER:"
          echo "  Builder compilation: PASSED"
          echo "  FINAL MASTER test: PASSED"
          echo "  PRELIMINARY MASTER test: PASSED"
          echo "  Immutable overwrite test: PASSED"

          echo ""
          echo "PG64:"
          echo "  2026-09-25 diagnostic/audit only"

          echo ""
          echo "Production MASTER:"
          echo "  PG62: validated"
          echo "  PG64: BLOCKED_DIAGNOSTIC_ONLY"

          echo "========================================"
