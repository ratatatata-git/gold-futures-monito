name: Test PDF Character Inventory

on:
  push:
    paths:
      - "scripts/extract_pdf_character_inventory.py"
      - "tests/test_pdf_character_inventory.py"
      - ".github/workflows/test-pdf-character-inventory.yml"
  pull_request:
    paths:
      - "scripts/extract_pdf_character_inventory.py"
      - "tests/test_pdf_character_inventory.py"
      - ".github/workflows/test-pdf-character-inventory.yml"
  workflow_dispatch:

jobs:
  test-character-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          python -m py_compile scripts/extract_pdf_character_inventory.py
          python -m py_compile tests/test_pdf_character_inventory.py
      - name: Run synthetic character grouping tests
        run: python -m unittest discover -s tests -p "test_pdf_character_inventory.py" -v
