name: Test PG62 Historical Audit Regression

on:
  push:
    paths:
      - "data/cme-pg62/PG62_2026-10-12.pdf"
      - "data/cme-pg62/PG62_2026-10-13.pdf"
      - "data/cme-pg62/PG62_2026-10-14.pdf"
      - "scripts/parse_pg62.py"
      - "tests/test_pg62_historical_audit.py"
      - "tests/test_pg62_cell_state_regression.py"
      - ".github/workflows/test-pg62-historical-audit.yml"
  pull_request:
    paths:
      - "data/cme-pg62/PG62_2026-10-12.pdf"
      - "data/cme-pg62/PG62_2026-10-13.pdf"
      - "data/cme-pg62/PG62_2026-10-14.pdf"
      - "scripts/parse_pg62.py"
      - "tests/test_pg62_historical_audit.py"
      - ".github/workflows/test-pg62-historical-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg62-historical-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install parser dependency
        run: python -m pip install pdfplumber
      - name: Run PG62 historical audit regression
        run: |
          python -m unittest discover -s tests -p "test_pg62_historical_audit.py" -v
          python -m unittest discover -s tests -p "test_pg62_cell_state_regression.py" -v
