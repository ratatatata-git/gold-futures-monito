name: Ingest PG62 Daily MASTER
on:
  push:
    paths:
      - "data/cme-pg62/**"
      - "scripts/parse_pg62_v5.py"
      - "scripts/build_pg62_master.py"
      - ".github/workflows/ingest-pg62-master.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pg62-master-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ------------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ------------------------------------------------------------
      # 3. Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pdfplumber
      # ------------------------------------------------------------
      # 4. Compile check
      # ------------------------------------------------------------
      - name: Compile PG62 parser and builder
        run: |
          python -m py_compile \
            scripts/parse_pg62_v5.py \
            scripts/build_pg62_master.py
      # ------------------------------------------------------------
      # 5. Ingest every PG62 PDF
      #
      # IMPORTANT:
      # --allow-parser-upgrade is intentional.
      #
      # Same PDF SHA + parser upgrade:
      #   v5.0.0 MASTER -> v5.0.1 MASTER
      #
      # Different PDF SHA:
      #   build_pg62_master.py refuses overwrite.
      # ------------------------------------------------------------
      - name: Build PG62 MASTER files
        shell: bash
        run: |
          set -u
          failed=0
          processed=0
          shopt -s nullglob
          pdfs=(data/cme-pg62/PG62_*.pdf)
          if [ ${#pdfs[@]} -eq 0 ]; then
            echo "No PG62 PDFs found."
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            echo
            echo "============================================================"
            echo "Processing: $pdf"
            echo "============================================================"
            processed=$((processed + 1))
            if python scripts/build_pg62_master.py \
              "$pdf" \
              --allow-parser-upgrade
            then
              echo "OK: $pdf"
            else
              echo "FAILED: $pdf"
              failed=1
            fi
          done
          echo
          echo "============================================================"
          echo "PG62 ingestion summary"
          echo "Processed: $processed"
          echo "Failed:    $failed"
          echo "============================================================"
          if [ "$failed" -ne 0 ]; then
            echo "One or more PG62 PDFs failed MASTER ingestion."
            exit 1
          fi
      # ------------------------------------------------------------
      # 6. Validate every existing PG62 MASTER
      #
      # Production MASTER must:
      # - be PG62_GC_FUTURES
      # - have validation PASS
      # - have VALIDATED master status
      # - have source_observation=true
      # - have derived_analysis=false
      # - contain no PARSER_ERROR
      # - have a valid source SHA256
      # - have reconciliation PASS
      # ------------------------------------------------------------
      - name: Validate PG62 MASTER files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path("data/master/pg62")
          if not root.exists():
              print("MASTER directory does not exist:", root)
              sys.exit(1)
          files = sorted(root.rglob("*.json"))
          if not files:
              print("No MASTER JSON files found.")
              sys.exit(1)
          errors = []
          def find_parser_error(value, path="$"):
              found = []
              if isinstance(value, dict):
                  if value.get("state") == "PARSER_ERROR":
                      found.append(path)
                  for key, child in value.items():
                      found.extend(
                          find_parser_error(
                              child,
                              f"{path}.{key}"
                          )
                      )
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      found.extend(
                          find_parser_error(
                              child,
                              f"{path}[{i}]"
                          )
                      )
              return found
          for path in files:
              print(f"Validating: {path}")
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  errors.append(
                      f"{path}: invalid JSON: {exc}"
                  )
                  continue
              # Dataset
              if data.get("dataset") != "PG62_GC_FUTURES":
                  errors.append(
                      f"{path}: unexpected dataset="
                      f"{data.get('dataset')!r}"
                  )
              # Parser version
              parser_version = data.get("parser_version")
              if not parser_version:
                  errors.append(
                      f"{path}: missing parser_version"
                  )
              # Validation
              validation = data.get("validation", {})
              if validation.get("status") != "PASS":
                  errors.append(
                      f"{path}: validation.status="
                      f"{validation.get('status')!r}"
                  )
              # MASTER metadata
              master = data.get("master", {})
              if master.get("status") != "VALIDATED":
                  errors.append(
                      f"{path}: master.status="
                      f"{master.get('status')!r}"
                  )
              if master.get("source_observation") is not True:
                  errors.append(
                      f"{path}: source_observation is not True"
                  )
              if master.get("derived_analysis") is not False:
                  errors.append(
                      f"{path}: derived_analysis is not False"
                  )
              # Contracts
              contracts = data.get("contracts", [])
              if len(contracts) < 20:
                  errors.append(
                      f"{path}: implausibly small contract count="
                      f"{len(contracts)}"
                  )
              # Source SHA256
              source = data.get("source", {})
              sha = source.get("sha256")
              if not isinstance(sha, str) or len(sha) != 64:
                  errors.append(
                      f"{path}: invalid source SHA256"
                  )
              # No parser errors
              parser_errors = find_parser_error(data)
              if parser_errors:
                  errors.append(
                      f"{path}: PARSER_ERROR at "
                      + ", ".join(parser_errors[:10])
                  )
              # Reconciliation
              reconciliation = validation.get(
                  "reconciliation",
                  {}
              )
              required_reconciliation_fields = [
                  "volume_globex",
                  "volume_pnt_pit",
                  "open_interest",
                  "oi_change",
              ]
              for field in required_reconciliation_fields:
                  item = reconciliation.get(field)
                  if not isinstance(item, dict):
                      errors.append(
                          f"{path}: missing reconciliation.{field}"
                      )
                      continue
                  if item.get("status") != "PASS":
                      errors.append(
                          f"{path}: reconciliation.{field} "
                          f"status={item.get('status')!r}"
                      )
              # Bulletin status
              bulletin = data.get("bulletin", {})
              status = bulletin.get("status")
              if status not in {"FINAL", "PRELIMINARY"}:
                  errors.append(
                      f"{path}: invalid bulletin status="
                      f"{status!r}"
                  )
          print()
          print("============================================================")
          print("MASTER validation summary")
          print(f"Files checked: {len(files)}")
          print(f"Errors:       {len(errors)}")
          print("============================================================")
          if errors:
              print()
              print("VALIDATION ERRORS:")
              for error in errors:
                  print(f" - {error}")
              sys.exit(1)
          print("All PG62 MASTER files passed validation.")
          PY
      # ------------------------------------------------------------
      # 7. Show changed files
      # ------------------------------------------------------------
      - name: Show MASTER changes
        run: |
          echo "Git status:"
          git status --short
          echo
          echo "MASTER files:"
          find data/master/pg62 -type f -name "*.json" | sort
      # ------------------------------------------------------------
      # 8. Commit generated MASTER files
      # ------------------------------------------------------------
      - name: Commit PG62 MASTER changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/pg62
          if git diff --cached --quiet; then
            echo "No MASTER changes to commit."
            exit 0
          fi
          git commit -m "Update PG62 daily MASTER"
      # ------------------------------------------------------------
      # 9. Push
      # ------------------------------------------------------------
      - name: Push PG62 MASTER changes
        run: |
          git push
